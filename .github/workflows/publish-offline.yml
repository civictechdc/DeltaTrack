name: Publish offline page

# Builds the offline page (`scripts/build_offline_html.py`: one HTML file carrying Pyodide
# and the engine, which compares two bill XML versions with nothing installed and nothing
# uploaded) and attaches it to the rolling `offline-latest` release. That gives the home
# page's download button one address that always serves the current build:
#
#   https://github.com/civictechdc/DeltaTrack/releases/download/offline-latest/deltatrack-offline.html
#
# It runs on push to `main`, like the hosted app and the example reports, so all three
# public surfaces move together at promotion (docs/release.md).
#
# Why not the Pages job: update-examples.yml publishes committed files and must not build
# anything (#42, #547). Why not commit the file: it is about 9 MB and changes with every
# engine change. A release asset is neither.
#
# The page is tested before it is published: the browser test opens the built file from
# disk and requires its report to be byte-identical to the command line's. A failure stops
# the job before the upload, so the previous build stays up.
on:
  push:
    branches: [main]

concurrency:
  group: publish-offline
  # Never cancel: a run stopped between deleting the old asset and uploading the new
  # one would leave the release with no file.
  cancel-in-progress: false

jobs:
  publish-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, move its tag and replace its asset
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browser
        run: uv run --locked playwright install --with-deps chromium

      - name: Test the offline page
        run: uv run --locked pytest tests/test_offline_html.py --run-browser --run-network -v

      - name: Build the offline page
        run: uv run --locked python scripts/build_offline_html.py -o dist/deltatrack-offline.html

      - name: Attach it to the offline-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="DeltaTrack in one HTML file: download it, open it in a browser, and compare two versions of a bill's XML on your own computer. Nothing is uploaded and no internet connection is needed. Built from ${GITHUB_SHA}."
          if gh release view offline-latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/offline-latest" -f sha="${GITHUB_SHA}" -F force=true
            gh release upload offline-latest dist/deltatrack-offline.html --clobber
            gh release edit offline-latest --notes "${notes}"
          else
            gh release create offline-latest dist/deltatrack-offline.html --target "${GITHUB_SHA}" --title "DeltaTrack offline page" --notes "${notes}" --latest=false
          fi
