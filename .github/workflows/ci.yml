name: CI

# `develop` is listed under push because it is the integration branch every contributor
# branches from, and until #412 nothing ran the suite when a commit landed on it. The
# pull-request run tests the head merged into the base AS THE BASE STOOD WHEN IT RAN, so
# a green required check can describe a merge that no longer resembles the one being
# performed: #396's `test` check was seven hours stale when it merged, and the package
# move in #402 had landed in between. `security.yml` already covered `develop` on push,
# which is why the branch showed green marks after that merge while the suite was
# uncollectable. This step is DETECTION, not prevention -- `develop` still goes red, but
# within minutes and attributed to the merge commit that caused it, instead of surfacing
# later on an unrelated pull request.
#
# Prevention arrived separately: a merge queue is now enabled on `develop`, and it tests
# the exact merge commit BEFORE it lands. That makes the `develop` push run a re-test of
# a commit `merge_group` just passed -- verified identical, not merely equivalent: the
# queue's merge commit reappears verbatim as the push SHA on every merge, batched entries
# included. KEEP IT ANYWAY. The queue is a branch-protection setting that does not appear
# in the REST protection payload, is absent from rulesets, and is pinned by no test, so if
# it is ever switched off nothing else would notice and this run becomes the only verdict
# on `develop` again. One extra run per merge, on free hosted runners, buys
# insurance against a silent config change. `main` has NO queue, so its push run is not
# redundant at all -- it is the only test of the promotion merge commit, whose
# pull-request run tested a preview rather than what landed.
#
# A push to a branch that also has an open pull request runs this workflow twice, once
# per event. Feature branches are unaffected: `develop` and `main` are only pushed to by
# a merge, which closes the pull request rather than synchronizing it. The one case that
# does double is the `develop` -> `main` promotion pull request, which is rare and
# maintainer-initiated, so it is accepted rather than worked around.
#
# DO NOT add a `concurrency` group with `cancel-in-progress: true`. Cancelling an
# in-flight run means a merge commit finishes with no verdict, which is this issue's gap
# in a new form. `update-examples.yml` uses that setting and is the nearby example likely
# to be copied. `tests/test_ci_workflow.py` fails if either half of this is undone.
#
# `merge_group` reports the required `test` check for pull requests sitting in a merge
# queue (#416). The queue is ENABLED on `develop`, so this trigger is live and fires on
# every merge; it is not enabled on `main`, where the event never fires. The trigger
# landed BEFORE the queue was turned on, deliberately: enabling the queue while the
# workflows lack this trigger means the required checks are never reported, so nothing
# merges until someone works out why. `checks_requested` is the only
# activity type the event has; it is named rather than defaulted so the file says what it
# responds to. `security.yml` carries the same trigger for the other required check.
on:
  pull_request:
  push:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

jobs:
  # Every job runs the one interpreter `.python-version` pins, the same one contributors
  # and the deployment use. The project supports that version only and moves to a newer
  # one deliberately, by editing the pin. History: a four-interpreter matrix (3.12.0, 3.12,
  # 3.13, 3.14) ran every job per leg until the move to one interpreter.
  #
  # Every test job except the browser one runs from a directory that is NOT the checkout,
  # with absolute paths into it. A fixture path resolved against the current working
  # directory is green from the repository root and nowhere else (#404). The static rule
  # in tests/test_fixture_layout.py matches only the tree names it enumerates, so varying
  # the working directory tests the property directly and needs no list. The browser
  # tier reaches no fixture path the other tiers do not, so it stays at the root.
  # History: #721 added a separate job that reran the whole non-browser suite from
  # outside the checkout; running each job from there covers the same tests once.

  # Lint and format.
  lint-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run --locked ruff check .
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run --locked ruff format --check .

  # Fast tests.
  fast-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      # The PDF extraction cache (tests/pdf_corpus.py) is keyed by PDF content and the
      # extractor's fingerprint (pdf_text.py, pypdfium2 and the Python runtime the tests run
      # on), so an entry restored from an earlier run is exactly what extraction would
      # produce now. Without it every job re-extracts the corpus from scratch.
      # The cache key carries the same fingerprint, so an extractor change starts from empty
      # rather than restoring entries nothing can read, and the PDFs' hash, so a new fixture
      # is saved instead of being re-extracted on every later hit. That hash also covers
      # tests/pdf_corpus.py, which decides what kinds of entry the directory holds: an exact hit
      # is never saved again, so a new kind would otherwise never reach the cache. The prefix
      # restore still brings back the entries that remain valid. The job name is in the key
      # because each job extracts a different subset: one shared key would be saved by
      # whichever job finished first and starve the others.
      - name: Fingerprint the PDF extractor
        id: extractor
        # Assigned first so a failing command fails the step (bash -e), instead of writing an
        # empty fingerprint into the key.
        run: |
          fingerprint=$(uv run --locked python -c 'from tests.pdf_corpus import _extractor_fingerprint; print(_extractor_fingerprint())')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the PDF extraction cache
        uses: actions/cache@v6
        with:
          path: tests/data/extract_cache
          key: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-${{ hashFiles('tests/**/*.pdf', 'tests/pdf_corpus.py') }}
          restore-keys: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-
      - name: Make a working directory outside the checkout
        run: mkdir -p "${{ runner.temp }}/not-the-repo-root"
      - name: Run fast tests
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/not-the-repo-root
        run: uv run --locked --project "$GITHUB_WORKSPACE" pytest "$GITHUB_WORKSPACE/tests" -m "not slow and not browser" -v

  # Browser tests. Includes the Playwright install.
  browser-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Playwright browser
        if: ${{ !cancelled() }}
        run: uv run --locked playwright install --with-deps chromium
      - name: Run browser tests
        if: ${{ !cancelled() }}
        # --run-browser: this step runs on dedicated hardware where Chromium is
        # guaranteed, so a launch failure must fail the run rather than skip every
        # test into a green no-op (#599).
        run: uv run --locked pytest -m browser --run-browser -v

  # External-validation suite: committee reports + legislative branch validation.
  external-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Make a working directory outside the checkout
        run: mkdir -p "${{ runner.temp }}/not-the-repo-root"
      - name: Run external-validation suite
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/not-the-repo-root
        run: >
          uv run --locked --project "$GITHUB_WORKSPACE" pytest -v -m slow
          "$GITHUB_WORKSPACE/tests/test_committee_report.py"
          "$GITHUB_WORKSPACE/tests/test_validate_extraction.py"

  # Corpus correctness gates: parametrize over committed manifest.
  corpus-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      # PDF extraction cache: see fast-tests.
      - name: Fingerprint the PDF extractor
        id: extractor
        # Assigned first so a failing command fails the step (bash -e), instead of writing an
        # empty fingerprint into the key.
        run: |
          fingerprint=$(uv run --locked python -c 'from tests.pdf_corpus import _extractor_fingerprint; print(_extractor_fingerprint())')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the PDF extraction cache
        uses: actions/cache@v6
        with:
          path: tests/data/extract_cache
          key: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-${{ hashFiles('tests/**/*.pdf', 'tests/pdf_corpus.py') }}
          restore-keys: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-
      - name: Make a working directory outside the checkout
        run: mkdir -p "${{ runner.temp }}/not-the-repo-root"
      - name: Run corpus correctness gates (committed manifest)
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/not-the-repo-root
        run: >
          uv run --locked --project "$GITHUB_WORKSPACE" pytest -v -m slow
          "$GITHUB_WORKSPACE/tests/test_corpus_properties.py"
          "$GITHUB_WORKSPACE/tests/test_corpus_tree_properties.py"
          "$GITHUB_WORKSPACE/tests/test_diff_validation.py"
          "$GITHUB_WORKSPACE/tests/test_node_join_corpus.py"
          "$GITHUB_WORKSPACE/tests/test_xml_subsection_nodes.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_subsection_recall.py"
          "$GITHUB_WORKSPACE/tests/test_canonical_baseline.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_canonical_baseline.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_matching_boundary.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_observation_emission.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_observation_identity.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_round1_retrieval.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_round1_revocation.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_round2_stages.py"
          "$GITHUB_WORKSPACE/tests/test_matching_contracts.py"
          "$GITHUB_WORKSPACE/tests/test_assignment_classification_boundary.py"
          "$GITHUB_WORKSPACE/tests/test_round1_stages.py"
          "$GITHUB_WORKSPACE/tests/test_round1_pairing_sentinel.py"

  # Packaging gate: build wheel, install in clean env, run diff from outside the checkout.
  packaging-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Make a working directory outside the checkout
        run: mkdir -p "${{ runner.temp }}/not-the-repo-root"
      - name: Run packaging gate (build, install, diff from outside the checkout)
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/not-the-repo-root
        run: >
          uv run --locked --project "$GITHUB_WORKSPACE" pytest -v -m slow
          "$GITHUB_WORKSPACE/tests/test_engine_installs.py"

  # Remaining slow suites: all other @slow modules against committed fixtures.
  remaining-slow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      # PDF extraction cache: see fast-tests.
      - name: Fingerprint the PDF extractor
        id: extractor
        # Assigned first so a failing command fails the step (bash -e), instead of writing an
        # empty fingerprint into the key.
        run: |
          fingerprint=$(uv run --locked python -c 'from tests.pdf_corpus import _extractor_fingerprint; print(_extractor_fingerprint())')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the PDF extraction cache
        uses: actions/cache@v6
        with:
          path: tests/data/extract_cache
          key: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-${{ hashFiles('tests/**/*.pdf', 'tests/pdf_corpus.py') }}
          restore-keys: pdf-extract-${{ github.job }}-${{ steps.extractor.outputs.fingerprint }}-
      - name: Make a working directory outside the checkout
        run: mkdir -p "${{ runner.temp }}/not-the-repo-root"
      - name: Run remaining slow suites (committed fixtures)
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/not-the-repo-root
        run: >
          uv run --locked --project "$GITHUB_WORKSPACE" pytest -v -m slow
          "$GITHUB_WORKSPACE/tests/test_classify_bill.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_corpus_smoke.py"
          "$GITHUB_WORKSPACE/tests/test_bill_tree.py"
          "$GITHUB_WORKSPACE/tests/test_structure_tree.py"
          "$GITHUB_WORKSPACE/tests/test_diff_bill.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_compare.py"
          "$GITHUB_WORKSPACE/tests/test_financial_diff.py"
          "$GITHUB_WORKSPACE/tests/test_pipeline_parity.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_xml_amount_recall.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_xml_prose_recall.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_word_break_recall.py"
          "$GITHUB_WORKSPACE/tests/test_full_text_layout.py"
          "$GITHUB_WORKSPACE/tests/test_report_from_document.py"
          "$GITHUB_WORKSPACE/tests/test_front_matter_parity.py"
          "$GITHUB_WORKSPACE/tests/test_xml_compare.py"
          "$GITHUB_WORKSPACE/tests/test_toc_tree.py"
          "$GITHUB_WORKSPACE/tests/test_format_html.py"
          "$GITHUB_WORKSPACE/tests/test_manifest_report_fixtures.py"
          "$GITHUB_WORKSPACE/tests/test_canonical_tree.py"
          "$GITHUB_WORKSPACE/tests/test_reconcile.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_watermark_recall.py"
          "$GITHUB_WORKSPACE/tests/test_formatters_text_serializer.py"
          "$GITHUB_WORKSPACE/tests/test_pdf_xml_withheld_recall.py"
          "$GITHUB_WORKSPACE/tests/test_cli_api_parity.py"

  # The required status check on `develop` and `main` is a context named exactly
  # `test`. Each job above reports its own context under its own name, so without this
  # aggregator the first job rename, split or matrix would silently strand branch
  # protection: every following pull request would wait on a context that no longer
  # reports (#426 review). This job reports `test` forever, however the jobs are
  # renamed or resized, and no branch-protection edit is needed.
  #
  # `if: always()` is load-bearing: a skipped or failed dependency would otherwise
  # skip this job too, and a skipped aggregator reports no verdict at all. The
  # explicit result checks are the other half: each `needs.<job>.result` must be
  # "success" -- a skipped or cancelled job surfaces as "skipped"/"cancelled", and
  # without the comparison below those would count as a pass, making the aggregator
  # a rubber stamp.
  test:
    needs: [lint-format, fast-tests, browser-tests, external-validation, corpus-gates, packaging-gate, remaining-slow]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every dependent job to have succeeded
        env:
          LINT_FORMAT_RESULT: ${{ needs.lint-format.result }}
          FAST_TESTS_RESULT: ${{ needs.fast-tests.result }}
          BROWSER_TESTS_RESULT: ${{ needs.browser-tests.result }}
          EXTERNAL_VALIDATION_RESULT: ${{ needs.external-validation.result }}
          CORPUS_GATES_RESULT: ${{ needs.corpus-gates.result }}
          PACKAGING_GATE_RESULT: ${{ needs.packaging-gate.result }}
          REMAINING_SLOW_RESULT: ${{ needs.remaining-slow.result }}
        run: |
          for result in \
            "$LINT_FORMAT_RESULT" \
            "$FAST_TESTS_RESULT" \
            "$BROWSER_TESTS_RESULT" \
            "$EXTERNAL_VALIDATION_RESULT" \
            "$CORPUS_GATES_RESULT" \
            "$PACKAGING_GATE_RESULT" \
            "$REMAINING_SLOW_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job result is '$result', not 'success'"
              exit 1
            fi
          done
          echo "All required jobs succeeded."