# Corpus test-fixture manifest — the single source of truth for the committed bill
# set the CI correctness gates run against. See docs/decisions/0015-corpus-test-fixtures.md.
#
# WHY THIS FILE EXISTS
# The corpus correctness gates (tests/test_corpus_properties.py,
# tests/test_corpus_tree_properties.py, tests/test_diff_validation.py) used to
# parametrize over `bills/*/[0-9]*_*.xml` discovered at collection time. `bills/` is
# gitignored, so the collected set was whatever each machine had fetched: counts were
# not reproducible, and on an unfetched checkout (including CI) the gates collected
# zero cases and passed green with no assertions — the fail-open trap ADR 0009 exists
# to prevent. This manifest replaces that glob: the gates parametrize over exactly the
# bills named here, every one of which is committed to git, so the collected set is
# byte-identical on every machine and in CI.
#
# HOW THE GATES READ IT
# tests/conftest.py loads this file once (stdlib tomllib) and derives the XML-file
# list, the PDF-file list, and the adjacent-version pairs the gates parametrize over.
# A file `tests/corpus/<id>/<stage>.<format>` is built for every (bill, version, format)
# below. Because those files are committed, a normal checkout always has them; the
# per-module completeness floor (test_manifest_fixtures_committed) fails closed if any
# is absent — that is the CI signal that a manifested fixture was not committed.
#
# VEHICLE — each bill names the kind of bill it is, one of: regular (one annual appropriations
# bill), omnibus (several annual bills in one, including minibuses and an omnibus carrying a
# continuing resolution), supplemental, continuing-resolution, reconciliation, authorizing (an
# authorizing law that appropriates directly), not-appropriations. It is the bill's, not the
# version's: a bill whose introduced text was something else and became an omnibus is
# `omnibus`. The ledger check reports its totals per vehicle (TESTING.md), and
# tests/test_corpus_manifest.py keeps the list closed.
#
# ADDING A FIXTURE — see the "Adding a corpus fixture" recipe in TESTING.md. In short:
# put the bill files under tests/corpus/<id>/ and `git add` them, add a [[bill]] entry
# here, and run the gates so any per-bill baseline (_KNOWN_DUPLICATE_COUNTS,
# _XML_DROP_BUDGET, ...) is calibrated. Manifest and committed files must move together.
# NOT bills/ — that tree is wholly gitignored since #308, so `git add` there is a silent
# no-op and the fixture would live only on your disk.
# An entry here also ENROLLS the bill in the corpus property gates, which may then
# content-skip on it; an undeclared skip fails the session. TESTING.md's "When a skip
# has to be declared" covers which allowlist applies, and when the right answer is to
# withhold the fixture instead — see this file's 115-hr-244 note for that case (#330).
#
# SCOPE (#217 / #126): the curated floor is the bills the gates encode hand-pinned
# baselines for, plus one bill per appropriations subcommittee and the key structural
# shapes (omnibus, enrolled, minibus, reconciliation, Senate print). The opt-in
# `CORPUS_SWEEP=1` exploratory mode still sweeps every locally-fetched bill.
#
# FORMAT PARITY (#126): the goal is that every version carries BOTH formats, so any
# pairing can be tested. #126 took that from 24 of 57 versions to 52. Read the real state
# off the `formats` fields, not off this comment; the five single-format entries are each
# deliberate and each says why at the version.
#
# What parity bought, measured when it landed: 27 PDFs joined the corpus, every
# DUAL-FORMAT version's XML dollar amounts are now cross-checked against its own PDF text
# (test_pdf_xml_amount_recall) — the five XML-only versions below have no PDF to check
# against and stay outside that gate until #519 lands — and four bills that had NO amount
# cross-check at all —
# 117-hr-2471, 116-hr-1865, 115-hr-1625, 115-hr-244 — gained one. Every added PDF was
# measured against that gate before being committed and none needed a new baseline.
#
# WHAT PARITY COST, which is the more useful half: five engrossed-amendment PDFs are
# WITHHELD because committing them would force weakening a gate that is absolute by
# design. They are the documents that exposed it — see #519. The subsection gates
# (test_pdf_subsection_recall, test_xml_subsection_nodes) assert recall and precision
# absolutely: no catchline-bearing subsection may be missed. These five each miss between
# one and three, and one also leaks quoted-block subsections. Committing them would mean
# either reddening the suite or adding a known-miss allowlist to a gate that deliberately
# has none. Each is named at its version below and is a ready-made regression fixture the
# moment #519 lands — the same posture as 115-hr-244 v5.
#
# The enrolled prints are the one tier that contributes NO structure: they carry no GPO
# margin line numbers, so extract_anchors returns nothing (#141). They are here for the
# amount cross-check, which reads PDF text and needs no anchors, and because the enrolled
# text is the one enacted into law. Each is declared in the zero-anchor registries in
# test_pdf_division_recall.py and test_corpus_tree_properties.py, which still ASSERT on
# them (documented layout, unnumbered classification, intact text layer) rather than
# skipping — so a numbered print that stops producing anchors still reddens.
#
# A NEW VERSION ADDED HERE SHOULD CARRY BOTH FORMATS. If only one is available, say why
# in the `covers` note, the way the 114-hr-2029 v4 entry does.

