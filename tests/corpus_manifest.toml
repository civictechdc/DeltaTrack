# --- Untitled-bill appropriations shape ----------------------------------------
# A supplemental appropriations act written with no TITLE divisions, so its accounts
# hang directly off a <section> under the bill body. That section is walked by
# `walk_body_sections` rather than the title path, and until #485 that walker had no
# appropriations branch at all: the whole account hierarchy was absorbed into the
# section's own text and no account node was created. The money still landed in a
# node, so every amount-conservation gate passed on it — which is why this shape needs
# a fixture that watches the account NAMES and ADDRESSES, not the amounts.
#
# Two versions so the shape is exercised at both ends of the bill's life (introduced
# and enrolled) and so an adjacent-version diff case exists. XML only: the collapse is
# an XML-walker defect, and no PDF for this bill is present locally (whether the PDF
# pipeline shows the same collapse is recorded as unverified on #485).

[[bill]]
id = "118-hr-9468"
subcommittee = "milcon-va / supplemental (no TITLE divisions)"
vehicle = "supplemental"
covers = "The corpus's untitled-appropriations shape: accounts as children of a bare body-level <section> with no <enum>, including a #474 split-account pair (name and money in separate sibling elements). Pins that `Compensation and Pensions` and `Readjustment Benefits` reach their own named, addressed nodes (test_bill_tree.py TestUntitledBillAppropriations) rather than collapsing into one unnamed entry (#485)."
versions = [
  { stage = "1_introduced-in-house", formats = ["xml", "pdf"], committee_report = [{citation = "none", chamber = "none", reason = "bill has no committee reports (introduced only or floor-amended omnibus)"}]},
  { stage = "4_enrolled-bill", formats = ["xml", "pdf"], committee_report = [{citation = "none", chamber = "none", reason = "bill has no committee reports (introduced only or floor-amended omnibus)"}]},
]

# --- Kinds of bill beyond regular appropriations (#733) ------------------------
# Money is appropriated outside the twelve annual bills too. One bill of each such kind is
# committed so every corpus gate, and the ledger check that grades where the PDF files each
# dollar amount (tests/test_pdf_ledger_location.py), measures that kind, and
# `python -m tests.ledger_location` reports each `vehicle` separately so one kind cannot hide
# behind another's volume. The versions are the ones that passed a chamber or became law, in
# both formats. None of them has a committee report of its own (checked against each bill's
# govinfo BILLSTATUS record): H.R. 5860, H.R. 815 and S. 2938 have none at all, and the House
# report on H.R. 1 explains the House text, not the Senate amendment committed here.

[[bill]]
id = "118-hr-5860"
subcommittee = "continuing resolution"
vehicle = "continuing-resolution"
covers = "Continuing Appropriations Act, 2024 (Division A) with other extensions (Division B): funds government at the prior year's rate by reference, so its ledger is the explicit amounts only (54 in the engrossed text) and it carries no appropriations-* heading at all. The corpus's only pure continuing resolution; 113-hr-83 mixes one into an omnibus. The enrolled print is unnumbered, so the ledger check reads the engrossed version and the pair gives the diff gates a nearly unchanged CR."
