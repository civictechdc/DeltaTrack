# The `rev` IS the Ruff version: pre-commit builds an isolated virtualenv per hook repo
# (`language: python`, no `additional_dependencies`), and each ruff-pre-commit tag pins the
# matching `ruff==` release. So this tag has to track the `ruff==` pin in pyproject.toml,
# which is what CI runs via `uv run ruff`. When the two drift, the hook silently enforces a
# different formatter than CI and a contributor can pass locally and fail CI (#646).
#
# `tests/test_precommit_ruff_version.py` fails if this tag and that pin disagree, because
# nothing else notices: Dependabot's `uv` ecosystem moves the pin and never touches this file.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
