# The hooks run `uv run ruff`, the same command CI runs, so the Ruff version is the `ruff==`
# pin in pyproject.toml and nothing here can drift from it. A hook from the
# astral-sh/ruff-pre-commit repo would instead install the release its `rev` tag names into its
# own virtualenv: a second copy of the version that Dependabot never moves (#646, #743).
# `tests/test_precommit_ruff_version.py` fails if a Ruff hook stops going through uv.
#
# `types_or` and `--force-exclude` follow ruff-pre-commit's own hook manifest. `--force-exclude`
# applies pyproject.toml's excludes to the files pre-commit passes explicitly.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
